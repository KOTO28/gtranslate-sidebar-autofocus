// gtranslate-sidebar-autofocus (この1行目はコメント必須: AutoConfig は1行目を読み飛ばします)
// Floorp / Firefox: Google翻訳のサイドバー(Webパネル)が表示されたら、そのパネルにフォーカスを移す

(() => {
  const LOG_PREFIX = "[gtranslate-sidebar-autofocus]";
  const INIT_FLAG = "__gtranslateSidebarAutofocusInit";
  const TARGET = /^https:\/\/translate\.google\./;

  function setup(win) {
    if (win[INIT_FLAG]) return;
    win[INIT_FLAG] = true;

    const doc = win.document;
    win.console.log(LOG_PREFIX, "loaded");

    // ウィンドウ内(サイドバー内の chrome ページも含む)の <browser> を全部集める
    const collectBrowsers = (d, out = []) => {
      for (const b of d.querySelectorAll("browser")) {
        out.push(b);
        // 非リモートの browser は中の document も探索
        try {
          if (!b.isRemoteBrowser && b.contentDocument)
            collectBrowsers(b.contentDocument, out);
        } catch (_) {}
      }
      return out;
    };

    const isTabBrowser = (b) =>
      !!win.gBrowser && win.gBrowser.browsers.includes(b);

    const isVisible = (b) => {
      try {
        if (b.checkVisibility) return b.checkVisibility();
        const r = b.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      } catch (_) {
        return false;
      }
    };

    const findTarget = () =>
      collectBrowsers(doc).find((b) => {
        if (isTabBrowser(b) || !isVisible(b)) return false;
        try {
          return TARGET.test(b.currentURI.spec);
        } catch (_) {
          return false;
        }
      }) || null;

    // 「非表示 → 表示」に変わった瞬間だけフォーカスする（普段の操作の邪魔をしないため）
    let wasVisible = !!findTarget();

    const check = () => {
      const target = findTarget();
      if (target && !wasVisible) {
        target.focus();
        win.console.log(LOG_PREFIX, "focused", target.currentURI.spec);
      }
      wasVisible = !!target;
    };

    let timers = [];
    const schedule = () => {
      timers.forEach((t) => win.clearTimeout(t));
      timers = [100, 300, 700, 1200].map((ms) => win.setTimeout(check, ms));
    };

    // パネルアイコンのクリックやショートカットで開いたときに確認
    win.addEventListener("click", schedule, true);
    win.addEventListener("command", schedule, true);
    win.addEventListener("keyup", schedule, true);
  }

  try {
    const obs = Cc["@mozilla.org/observer-service;1"].getService(
      Ci.nsIObserverService,
    );
    obs.addObserver(
      {
        observe(win) {
          if (win.location.href !== "chrome://browser/content/browser.xhtml")
            return;
          setup(win);
        },
      },
      "browser-delayed-startup-finished",
    );
  } catch (e) {
    Cu.reportError(e);
  }
})();
